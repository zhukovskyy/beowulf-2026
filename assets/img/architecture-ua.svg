<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300"
     role="img" aria-labelledby="archTitle archDesc">
  <title id="archTitle">Архітектура телемедичного комплекту</title>
  <desc id="archDesc">Медичні пристрої та датчики біля пацієнта передають дані на edge- або fog-вузол, де вони буферизуються, перевіряються й попередньо обробляються. Далі вузол надсилає вимірювання через REST API до медичної інформаційної системи, до якої лікар має доступ на відстані.</desc>
  <style>
    .box { fill: #ffffff; stroke: #0b6271; stroke-width: 2; }
    .box-accent { fill: #e3f0f2; stroke: #0b6271; stroke-width: 2; }
    .t { font-family: system-ui, "Segoe UI", Roboto, Arial, sans-serif; fill: #0f1f28; }
    .h { font-size: 17px; font-weight: 650; }
    .s { font-size: 13px; fill: #475a66; }
    .lbl { font-size: 12px; fill: #0b6271; font-weight: 650; letter-spacing: .04em; }
    .arrow { stroke: #0b6271; stroke-width: 2.5; fill: none; }
    @media (prefers-color-scheme: dark) {
      .box { fill: #141f26; stroke: #5ecfc4; }
      .box-accent { fill: #15292e; stroke: #5ecfc4; }
      .t { fill: #e9f1f4; }
      .s { fill: #a7bcc6; }
      .lbl { fill: #8ae0d7; }
      .arrow { stroke: #5ecfc4; }
    }
  </style>
  <defs>
    <marker id="headUa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>

  <g class="arrow" color="#0b6271">
    <line x1="232" y1="120" x2="316" y2="120" marker-end="url(#headUa)"/>
    <line x1="564" y1="120" x2="648" y2="120" marker-end="url(#headUa)"/>
    <line x1="760" y1="172" x2="760" y2="222" marker-end="url(#headUa)"/>
  </g>

  <rect class="box" x="16" y="56" width="216" height="128" rx="12"/>
  <text class="t h" x="36" y="88">Пристрої пацієнта</text>
  <text class="t s" x="36" y="112">Датчики: пульс, SpO2,</text>
  <text class="t s" x="36" y="132">температура, ЕКГ, тиск,</text>
  <text class="t s" x="36" y="152">вага, глюкоза</text>
  <text class="t s" x="36" y="172">BLE · USB · UART</text>

  <rect class="box-accent" x="316" y="40" width="248" height="160" rx="12"/>
  <text class="t h" x="336" y="72">Edge / fog-вузол</text>
  <text class="t s" x="336" y="96">Raspberry Pi або ESP32</text>
  <text class="t s" x="336" y="116">поруч із пацієнтом:</text>
  <text class="t s" x="336" y="136">збір, валідація, фільтрація,</text>
  <text class="t s" x="336" y="156">буфер при втраті зв&#8217;язку,</text>
  <text class="t s" x="336" y="176">локальне шифрування</text>

  <rect class="box" x="648" y="56" width="216" height="116" rx="12"/>
  <text class="t h" x="668" y="88">МІС</text>
  <text class="t s" x="668" y="112">Медична інформаційна</text>
  <text class="t s" x="668" y="132">система: карта пацієнта,</text>
  <text class="t s" x="668" y="152">історія вимірювань</text>

  <rect class="box" x="648" y="222" width="216" height="62" rx="12"/>
  <text class="t h" x="668" y="252">Лікар на відстані</text>
  <text class="t s" x="668" y="272">вебінтерфейс МІС</text>

  <text class="lbl" x="254" y="110">ДАНІ</text>
  <text class="lbl" x="576" y="104">REST API</text>
  <text class="lbl" x="588" y="142">JSON</text>
</svg>
