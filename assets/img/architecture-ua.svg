<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300"
     role="img" aria-labelledby="archTitle archDesc">
  <title id="archTitle">Архітектура комплекту: edge → fog → хмара</title>
  <desc id="archDesc">Edge-рівень — це самі вимірювальні пристрої біля пацієнта: датчики й готові прилади, які знімають показник і роблять первинну обробку. Fog-рівень — вузол, що об’єднує кілька таких пристроїв, перевіряє та буферизує дані, виконує локальну аналітику. Далі fog-вузол передає вимірювання через REST API у форматі JSON до медичної інформаційної системи в хмарі, до якої лікар має доступ на відстані.</desc>
  <style>
    .box { fill: #ffffff; stroke: #0b6271; stroke-width: 2; }
    .box-accent { fill: #e3f0f2; stroke: #0b6271; stroke-width: 2; }
    .t { font-family: system-ui, "Segoe UI", Roboto, Arial, sans-serif; fill: #0f1f28; }
    .h { font-size: 17px; font-weight: 650; }
    .s { font-size: 13px; fill: #475a66; }
    .lbl { font-size: 12px; fill: #0b6271; font-weight: 650; letter-spacing: .04em; }
    .arrow { stroke: #0b6271; stroke-width: 2.5; fill: none; }
    @media (prefers-color-scheme: dark) {
      .box { fill: #141f26; stroke: #5ecfc4; }
      .box-accent { fill: #15292e; stroke: #5ecfc4; }
      .t { fill: #e9f1f4; }
      .s { fill: #a7bcc6; }
      .lbl { fill: #8ae0d7; }
      .arrow { stroke: #5ecfc4; }
    }
  </style>
  <defs>
    <marker id="headUa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>

  <g class="arrow" color="#0b6271">
    <line x1="232" y1="120" x2="316" y2="120" marker-end="url(#headUa)"/>
    <line x1="564" y1="120" x2="648" y2="120" marker-end="url(#headUa)"/>
    <line x1="760" y1="172" x2="760" y2="222" marker-end="url(#headUa)"/>
  </g>

  <rect class="box" x="16" y="56" width="216" height="128" rx="12"/>
  <text class="t h" x="36" y="86">EDGE — пристрої</text>
  <text class="t s" x="36" y="110">Датчики й готові прилади</text>
  <text class="t s" x="36" y="130">біля пацієнта: пульс, SpO2,</text>
  <text class="t s" x="36" y="150">температура, ЕКГ, тиск,</text>
  <text class="t s" x="36" y="170">вага, глюкоза</text>

  <rect class="box-accent" x="316" y="40" width="248" height="160" rx="12"/>
  <text class="t h" x="336" y="70">FOG — вузол-збирач</text>
  <text class="t s" x="336" y="94">Raspberry Pi або міні-ПК:</text>
  <text class="t s" x="336" y="114">об’єднує кілька пристроїв,</text>
  <text class="t s" x="336" y="134">валідація, буфер при втраті</text>
  <text class="t s" x="336" y="154">зв’язку, шифрування,</text>
  <text class="t s" x="336" y="174">локальна аналітика / AI</text>

  <rect class="box" x="648" y="56" width="216" height="116" rx="12"/>
  <text class="t h" x="668" y="86">CLOUD — МІС</text>
  <text class="t s" x="668" y="110">Медична інформаційна</text>
  <text class="t s" x="668" y="130">система: картка пацієнта,</text>
  <text class="t s" x="668" y="150">історія вимірювань</text>

  <rect class="box" x="648" y="222" width="216" height="62" rx="12"/>
  <text class="t h" x="668" y="252">Лікар на відстані</text>
  <text class="t s" x="668" y="272">вебінтерфейс МІС</text>

  <text class="lbl" x="245" y="104">BLE / USB</text>
  <text class="lbl" x="258" y="142">UART</text>
  <text class="lbl" x="576" y="104">REST API</text>
  <text class="lbl" x="588" y="142">JSON</text>
</svg>
